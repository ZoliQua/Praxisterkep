name: monthly-etl
on:
  schedule:
    - cron: "0 5 5 * *"   # 5th of month, 05:00 UTC
    - cron: "0 5 15 * *"  # retry window on the 15th
  workflow_dispatch: {}

jobs:
  etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - name: Run ETL tests
        run: cd etl && python -m pytest -q
      - name: Run pipeline
        id: pipeline
        run: python etl/run.py
      # The supplements and analyses do not abort the run — but whatever did
      # rebuild is worth publishing, so the snapshot is committed first and
      # the failures are reported afterwards.
      - name: Commit snapshot
        if: success()
        run: |
          git config user.name "Dul Zoltán"
          git config user.email "ZoliQua@users.noreply.github.com"
          # the geocode and address caches are part of the build: without
          # them the coordinates this run looked up are lost, the next run asks
          # Nominatim again, and a local rebuild comes out without them
          git add data/ etl/geocode_cache.json etl/address_cache.json
          git diff --cached --quiet || git commit -m "data: monthly NEAK snapshot"
          git push
      - name: Report skipped or failed steps
        if: success()
        run: python etl/pipeline.py --check
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          # the pipeline runs twice a month: a failure still open from the
          # first run gets a comment, not a second issue
          script: |
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const known = open.find((i) => !i.pull_request && i.title.startsWith("ETL failed:"));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (known) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: known.number,
                body: `Failed again on ${new Date().toISOString().slice(0,10)}: ${run}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ETL failed: ${new Date().toISOString().slice(0,10)}`,
              body: [
                "The monthly pipeline did not finish cleanly.",
                "",
                "If the core NEAK steps failed, nothing was published — check the run log and do not force-publish.",
                "If a supplement or an analysis failed, the rest was committed and `data/pipeline.json` names what is missing; anything built on top of it was skipped rather than recomputed from stale input."
              ].join("\n")
            })
