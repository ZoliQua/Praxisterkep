    <!-- THEME_BOOT (lib/theme.ts): light/dark, colour scheme, the internal-site link -->
    <script>(function(){var d=document.documentElement;try{var s=localStorage,t=s.getItem('theme'),p=s.getItem('palette');d.dataset.theme=t==='light'?'light':'dark';if(p&&/^[a-z]+$/.test(p))d.dataset.palette=p;}catch(e){d.dataset.theme='dark';}try{var b=new URLSearchParams(location.search).get('belso'),ss=sessionStorage;if(b==='true')ss.setItem('belso','1');else if(b==='false')ss.removeItem('belso');if(ss.getItem('belso')==='1')d.dataset.internal='1';}catch(e){}})();</script>
    <!-- CANONICAL_BOOT (lib/seo.ts): the one address a search engine should take this page for -->
    <script>(function(){try{var l=location,p=l.pathname.replace(/\/index\.html$/,'/'),q=new URLSearchParams(l.search),o=new URLSearchParams(),k=p==='/megye.html'?'m':p==='/jaras.html'?'jar':'';if(k&&q.get(k))o.set(k,q.get(k));var b='https://praxisterkep.hu'+p,h=document.head,a=function(r,u,g){var e=document.createElement('link');e.rel=r;e.href=u;if(g)e.hreflang=g;h.appendChild(e);},s=o.toString(),hu=b+(s?'?'+s:'');o.set('lang','en');var en=b+'?'+o.toString();a('canonical',q.get('lang')==='en'?en:hu);a('alternate',hu,'hu');a('alternate',en,'en');a('alternate',hu,'x-default');}catch(e){}})();</script>
